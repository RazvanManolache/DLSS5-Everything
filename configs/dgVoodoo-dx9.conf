; Text configuration format used by the bundled dgVoodoo 2.87 package.
; Without the root version, dgVoodoo can ignore the per-game settings.
Version = 0x287

[GeneralExt]
; Empty means no synthetic desktop resolution override.
DesktopResolution =

[DirectX]
dgVoodooWatermark = false
VRAM = 1024
DisableAltEnterToToggleScreenMode = false

[Glide]
3DfxWatermark = false
